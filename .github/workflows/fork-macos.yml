name: Fork macOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.repository == 'mcmanussliam/ghostty'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read required Zig version
        id: zig
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'minimum_zig_version\s*=\s*"([^"]+)"', Path('build.zig.zon').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}
      - name: Install macOS build tools
        run: |
          brew install nushell swiftlint gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
      - name: Check release tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_fork_release.py'
      - name: Lint Swift
        run: swiftlint lint --strict
      - name: Build GhosttyKit and resources
        run: zig build -Demit-macos-app=false -Dxcframework-target=native
      - name: Run macOS unit tests
        run: macos/build.nu --action test
      - name: Build local release app
        run: macos/build.nu --configuration ReleaseLocal
      - name: Archive app preserving symlinks
        run: ditto -c -k --sequesterRsrc --keepParent macos/build/ReleaseLocal/Ghostty.app ghostty-fork-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostty-fork-macos-${{ github.sha }}
          path: ghostty-fork-macos.zip
          if-no-files-found: error
