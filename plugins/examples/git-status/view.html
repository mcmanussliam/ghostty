<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'" />
    <title>Git Changes</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
        --text: #24262a;
        --muted: #6b6e75;
        --line: #00000012;
        --hover: #00000006;
        color: var(--text);
        background: var(--ghostty-background, #f6f6f6);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e4e6eb;
          --muted: #989da8;
          --line: #ffffff12;
          --hover: #ffffff08;
          background: var(--ghostty-background, #202124);
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { display: flex; align-items: start; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
      #repository { flex: 1; min-width: 0; }
      h1 { margin: 0; font: inherit; font-weight: 500; }
      #root { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
      #root, h1 { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      button {
        margin-left: auto; padding: 2px 5px; border: 0; border-radius: 3px;
        font: inherit; color: var(--muted); background: transparent; cursor: pointer;
      }
      button:hover { color: var(--text); background: var(--hover); }
      button:focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
      .section { display: flex; gap: 6px; padding: 8px 12px 4px; color: var(--muted); }
      h2 { margin: 0; font: inherit; }
      #count { font-variant-numeric: tabular-nums; }
      ul { margin: 0; padding: 0 12px; list-style: none; }
      li { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; }
      .status { flex: none; width: 2ch; font: 12px/1.5 ui-monospace, monospace; white-space: pre; color: var(--muted); }
      .status[data-kind="conflict"] { color: #c45a50; }
      .path { min-width: 0; display: flex; align-items: baseline; gap: 6px; }
      .name { overflow-wrap: anywhere; white-space: pre-wrap; }
      .directory { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: pre; font-size: 12px; color: var(--muted); }
      #empty, #summary { margin: 10px 12px; color: var(--muted); }
      #summary:empty { display: none; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <div id="repository" hidden>
        <h1 id="branch"></h1>
        <p id="root"></p>
      </div>
      <button id="refresh" title="Refresh Git status" aria-label="Refresh Git status" disabled>Refresh</button>
    </header>
    <div class="section">
      <h2>Changes</h2><span id="count"></span>
    </div>
    <ul id="files" aria-label="Changed files"></ul>
    <p id="empty" hidden>Working tree clean</p>
    <p id="summary" role="status"></p>
    <script src="dist/view.js"></script>
  </body>
</html>
